<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ER Diagram</title>
<style>
  body { margin: 0; background: #fff; font-family: Helvetica, Arial, sans-serif; }
  svg text { font-size: 15px; fill: #111827; }
  .entity rect { fill: #e0e7ff; stroke: #1e1b4b; stroke-width: 2; }
  .entity text { font-weight: 700; font-size: 16px; }
  .weak rect { fill: #e0e7ff; stroke: #1e1b4b; stroke-width: 2; }
  .rel polygon { fill: #fef3c7; stroke: #78350f; stroke-width: 2; }
  .rel text { font-weight: 700; font-size: 14px; }
  .attr ellipse { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
  .key text { text-decoration: underline; font-weight: 700; }
  .line { stroke: #374151; stroke-width: 1.5; }
  .total { stroke: #111827; stroke-width: 7; }
  .total-inner { stroke: #ffffff; stroke-width: 3; }
  .card { font-size: 18px; font-weight: 700; fill: #b91c1c; }
  .legend text { font-size: 13px; }
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1400" height="1220" viewBox="0 0 1400 1220">
  <text x="700" y="40" text-anchor="middle" style="font-size:24px;font-weight:700">ER Diagram — Student Lost and Found Item Tracking System</text>

  <!-- ===== attribute connector lines (drawn first, under shapes) ===== -->
  <g class="line">
    <!-- STUDENT (300,330) -->
    <line x1="300" y1="330" x2="140" y2="200"/><line x1="300" y1="330" x2="300" y2="170"/>
    <line x1="300" y1="330" x2="465" y2="200"/><line x1="300" y1="330" x2="105" y2="330"/>
    <line x1="300" y1="330" x2="140" y2="460"/><line x1="300" y1="330" x2="270" y2="485"/>
    <!-- ITEM_REPORT (1100,330) -->
    <line x1="1100" y1="330" x2="950" y2="195"/><line x1="1100" y1="330" x2="1110" y2="165"/>
    <line x1="1100" y1="330" x2="1275" y2="195"/><line x1="1100" y1="330" x2="1300" y2="300"/>
    <line x1="1100" y1="330" x2="1300" y2="395"/><line x1="1100" y1="330" x2="1275" y2="490"/>
    <line x1="1100" y1="330" x2="1130" y2="490"/>
    <!-- CLAIM (700,700) -->
    <line x1="700" y1="700" x2="505" y2="790"/><line x1="700" y1="700" x2="470" y2="700"/>
    <line x1="700" y1="700" x2="900" y2="790"/><line x1="700" y1="700" x2="935" y2="700"/>
    <!-- ITEM_RETURN (700,1050) -->
    <line x1="700" y1="1050" x2="480" y2="1050"/><line x1="700" y1="1050" x2="920" y2="1050"/>
    <line x1="700" y1="1050" x2="700" y2="1150"/>
  </g>

  <!-- ===== relationship lines (double = total participation) ===== -->
  <!-- STUDENT - REPORTS (partial) -->
  <line class="line" x1="380" y1="330" x2="620" y2="330"/>
  <!-- REPORTS - ITEM_REPORT (total) -->
  <line class="total" x1="780" y1="330" x2="1010" y2="330"/><line class="total-inner" x1="780" y1="330" x2="1010" y2="330"/>
  <!-- STUDENT - MAKES (partial) -->
  <line class="line" x1="330" y1="358" x2="420" y2="530"/>
  <!-- MAKES - CLAIM (total) -->
  <line class="total" x1="470" y1="590" x2="625" y2="690"/><line class="total-inner" x1="470" y1="590" x2="625" y2="690"/>
  <!-- ITEM_REPORT - RECEIVES (partial) -->
  <line class="line" x1="1070" y1="358" x2="985" y2="530"/>
  <!-- RECEIVES - CLAIM (total) -->
  <line class="total" x1="935" y1="590" x2="775" y2="690"/><line class="total-inner" x1="935" y1="590" x2="775" y2="690"/>
  <!-- CLAIM - RESULTS_IN (partial) -->
  <line class="line" x1="700" y1="728" x2="700" y2="840"/>
  <!-- RESULTS_IN - ITEM_RETURN (total) -->
  <line class="total" x1="700" y1="920" x2="700" y2="1022"/><line class="total-inner" x1="700" y1="920" x2="700" y2="1022"/>

  <!-- ===== cardinalities ===== -->
  <text class="card" x="395" y="320">1</text><text class="card" x="985" y="320">N</text>
  <text class="card" x="355" y="420">1</text><text class="card" x="600" y="665">N</text>
  <text class="card" x="1050" y="420">1</text><text class="card" x="790" y="665">N</text>
  <text class="card" x="712" y="760">1</text><text class="card" x="712" y="1010">1</text>

  <!-- ===== entities ===== -->
  <g class="entity"><rect x="220" y="302" width="160" height="56"/><text x="300" y="336" text-anchor="middle">STUDENT</text></g>
  <g class="entity"><rect x="1010" y="302" width="180" height="56"/><text x="1100" y="336" text-anchor="middle">ITEM_REPORT</text></g>
  <g class="entity"><rect x="625" y="672" width="150" height="56"/><text x="700" y="706" text-anchor="middle">CLAIM</text></g>
  <g class="entity"><rect x="610" y="1022" width="180" height="56"/><text x="700" y="1056" text-anchor="middle">ITEM_RETURN</text></g>

  <!-- ===== relationships ===== -->
  <g class="rel"><polygon points="700,280 780,330 700,380 620,330"/><text x="700" y="335" text-anchor="middle">REPORTS</text></g>
  <g class="rel"><polygon points="445,520 515,560 445,600 375,560"/><text x="445" y="565" text-anchor="middle">MAKES</text></g>
  <g class="rel"><polygon points="960,520 1035,560 960,600 885,560"/><text x="960" y="565" text-anchor="middle">RECEIVES</text></g>
  <g class="rel"><polygon points="700,840 790,880 700,920 610,880"/><text x="700" y="885" text-anchor="middle">RESULTS_IN</text></g>

  <!-- ===== attributes ===== -->
  <g class="attr key"><ellipse cx="140" cy="200" rx="75" ry="24"/><text x="140" y="205" text-anchor="middle">Student_ID</text></g>
  <g class="attr"><ellipse cx="300" cy="170" rx="55" ry="24"/><text x="300" y="175" text-anchor="middle">Name</text></g>
  <g class="attr"><ellipse cx="465" cy="200" rx="60" ry="24"/><text x="465" y="205" text-anchor="middle">Email</text></g>
  <g class="attr"><ellipse cx="105" cy="330" rx="60" ry="24"/><text x="105" y="335" text-anchor="middle">Phone</text></g>
  <g class="attr"><ellipse cx="140" cy="460" rx="90" ry="24"/><text x="140" y="465" text-anchor="middle">Password_Hash</text></g>
  <g class="attr"><ellipse cx="270" cy="485" rx="50" ry="24"/><text x="270" y="490" text-anchor="middle">Role</text></g>

  <g class="attr key"><ellipse cx="950" cy="195" rx="70" ry="24"/><text x="950" y="200" text-anchor="middle">Report_ID</text></g>
  <g class="attr"><ellipse cx="1110" cy="165" rx="72" ry="24"/><text x="1110" y="170" text-anchor="middle">Item_Name</text></g>
  <g class="attr"><ellipse cx="1275" cy="195" rx="80" ry="24"/><text x="1275" y="200" text-anchor="middle">Description</text></g>
  <g class="attr"><ellipse cx="1300" cy="300" rx="80" ry="24"/><text x="1300" y="305" text-anchor="middle">Report_Type</text></g>
  <g class="attr"><ellipse cx="1300" cy="395" rx="65" ry="24"/><text x="1300" y="400" text-anchor="middle">Location</text></g>
  <g class="attr"><ellipse cx="1275" cy="490" rx="90" ry="24"/><text x="1275" y="495" text-anchor="middle">Date_Reported</text></g>
  <g class="attr"><ellipse cx="1130" cy="490" rx="50" ry="24"/><text x="1130" y="495" text-anchor="middle">Status</text></g>

  <g class="attr key"><ellipse cx="470" cy="700" rx="65" ry="24"/><text x="470" y="705" text-anchor="middle">Claim_ID</text></g>
  <g class="attr"><ellipse cx="505" cy="790" rx="75" ry="24"/><text x="505" y="795" text-anchor="middle">Claim_Date</text></g>
  <g class="attr"><ellipse cx="935" cy="700" rx="65" ry="24"/><text x="935" y="705" text-anchor="middle">Remarks</text></g>
  <g class="attr"><ellipse cx="900" cy="790" rx="80" ry="24"/><text x="900" y="795" text-anchor="middle">Claim_Status</text></g>

  <g class="attr key"><ellipse cx="480" cy="1050" rx="70" ry="24"/><text x="480" y="1055" text-anchor="middle">Return_ID</text></g>
  <g class="attr"><ellipse cx="920" cy="1050" rx="90" ry="24"/><text x="920" y="1055" text-anchor="middle">Returned_Date</text></g>
  <g class="attr"><ellipse cx="700" cy="1150" rx="65" ry="24"/><text x="700" y="1155" text-anchor="middle">Remarks</text></g>

  <!-- ===== legend ===== -->
  <g class="legend" transform="translate(1040,880)">
    <rect x="0" y="0" width="330" height="200" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="16" y="28" style="font-weight:700;font-size:14px">Legend</text>
    <rect x="16" y="44" width="46" height="22" fill="#e0e7ff" stroke="#1e1b4b" stroke-width="2"/><text x="74" y="60">Entity</text>
    <polygon points="39,78 62,92 39,106 16,92" fill="#fef3c7" stroke="#78350f" stroke-width="2"/><text x="74" y="97">Relationship</text>
    <ellipse cx="39" cy="126" rx="23" ry="12" fill="#fff" stroke="#374151"/><text x="74" y="131">Attribute (<tspan text-decoration="underline">key</tspan> underlined)</text>
    <line x1="16" y1="155" x2="62" y2="155" class="line"/><text x="74" y="160">Partial participation</text>
    <line x1="16" y1="180" x2="62" y2="180" class="total"/><line x1="16" y1="180" x2="62" y2="180" class="total-inner"/><text x="74" y="185">Total participation</text>
  </g>
</svg>
</body>
</html>
