<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System Architecture</title>
<style>
  body { margin: 0; background: #fff; font-family: Helvetica, Arial, sans-serif; }
  svg text { fill: #111827; font-size: 14px; }
  .title { font-size: 17px; font-weight: 700; }
  .sub { font-size: 13px; fill: #4b5563; }
  .box { stroke-width: 2; rx: 14; }
  .flow { stroke: #4338ca; stroke-width: 2.5; fill: none; }
  .flow-label { font-size: 13px; fill: #312e81; font-weight: 600; }
  .step { fill: #4338ca; }
  .step-text { fill: #fff; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#4338ca"/>
    </marker>
  </defs>

  <text x="700" y="40" text-anchor="middle" style="font-size:24px;font-weight:700">System Architecture</text>

  <!-- Tier labels -->
  <text x="40" y="95" style="font-size:13px;font-weight:700;fill:#6b7280">PRESENTATION TIER</text>
  <text x="40" y="325" style="font-size:13px;font-weight:700;fill:#6b7280">APPLICATION TIER</text>
  <text x="40" y="585" style="font-size:13px;font-weight:700;fill:#6b7280">DATA TIER</text>
  <line x1="40" y1="300" x2="1360" y2="300" stroke="#e5e7eb" stroke-dasharray="6 6"/>
  <line x1="40" y1="560" x2="1360" y2="560" stroke="#e5e7eb" stroke-dasharray="6 6"/>

  <!-- Browser / Next.js -->
  <rect class="box" x="450" y="110" width="500" height="160" fill="#eef2ff" stroke="#4338ca"/>
  <text class="title" x="700" y="142" text-anchor="middle">Next.js 16 + Tailwind CSS (browser) — :3000</text>
  <text class="sub" x="700" y="170" text-anchor="middle">Student pages: dashboard, report lost/found, browse &amp; search,</text>
  <text class="sub" x="700" y="190" text-anchor="middle">item details, matches, claim, my reports, my claims</text>
  <text class="sub" x="700" y="214" text-anchor="middle">Admin pages: dashboard, manage claims, return history</text>
  <text class="sub" x="700" y="242" text-anchor="middle">JWT kept in localStorage, sent as  Authorization: Bearer &lt;token&gt;</text>

  <!-- Express -->
  <rect class="box" x="400" y="340" width="600" height="190" fill="#f0fdf4" stroke="#15803d"/>
  <text class="title" x="700" y="372" text-anchor="middle">Node.js + Express 5 REST API — :5001</text>
  <text class="sub" x="700" y="400" text-anchor="middle">Routes: /api/auth · /api/reports · /api/claims · /api/returns · /api/search · /api/admin</text>
  <text class="sub" x="700" y="424" text-anchor="middle">Middleware: authenticate (JWT verify) · requireRole('ADMIN') · input validation</text>
  <text class="sub" x="700" y="448" text-anchor="middle">Central error handler (maps MySQL SIGNAL / duplicate key → 400 / 409)</text>
  <text class="sub" x="700" y="472" text-anchor="middle">bcrypt password hashing · parameterised SQL (mysql2)</text>
  <text class="sub" x="700" y="500" text-anchor="middle">reportSync service: MySQL first → embed → Qdrant upsert / payload update / delete</text>

  <!-- MySQL -->
  <rect class="box" x="90" y="600" width="420" height="180" fill="#fff7ed" stroke="#c2410c"/>
  <text class="title" x="300" y="632" text-anchor="middle">MySQL 9 — lost_found_db (:3306)</text>
  <text class="sub" x="300" y="658" text-anchor="middle">SOURCE OF TRUTH</text>
  <text class="sub" x="300" y="684" text-anchor="middle">STUDENT · ITEM_REPORT · CLAIM · ITEM_RETURN</text>
  <text class="sub" x="300" y="708" text-anchor="middle">Procedures: GetLostItems, ApproveClaim, RecordItemReturn</text>
  <text class="sub" x="300" y="730" text-anchor="middle">Functions · 4 Triggers · Views · MySQL roles</text>
  <text class="sub" x="300" y="752" text-anchor="middle">(lf_student_role, lf_admin_role)</text>

  <!-- Embedding service -->
  <rect class="box" x="560" y="600" width="300" height="180" fill="#fdf4ff" stroke="#a21caf"/>
  <text class="title" x="710" y="632" text-anchor="middle">Embedding service — :8001</text>
  <text class="sub" x="710" y="660" text-anchor="middle">Python · FastAPI · uvicorn</text>
  <text class="sub" x="710" y="686" text-anchor="middle">sentence-transformers</text>
  <text class="sub" x="710" y="708" text-anchor="middle">all-MiniLM-L6-v2</text>
  <text class="sub" x="710" y="734" text-anchor="middle">text → 384-d normalised vector</text>

  <!-- Qdrant -->
  <rect class="box" x="910" y="600" width="400" height="180" fill="#ecfeff" stroke="#0e7490"/>
  <text class="title" x="1110" y="632" text-anchor="middle">Qdrant vector DB — :6333 (Docker)</text>
  <text class="sub" x="1110" y="660" text-anchor="middle">collection: lost_found_items</text>
  <text class="sub" x="1110" y="684" text-anchor="middle">size 384 · distance Cosine</text>
  <text class="sub" x="1110" y="708" text-anchor="middle">point id = Report_ID</text>
  <text class="sub" x="1110" y="732" text-anchor="middle">payload: report_type, status, student_id, …</text>
  <text class="sub" x="1110" y="756" text-anchor="middle">filtered similarity search</text>

  <!-- Flows -->
  <path class="flow" marker-end="url(#ah)" d="M 650 270 L 650 338"/>
  <path class="flow" marker-end="url(#ah)" d="M 750 338 L 750 272"/>
  <text class="flow-label" x="560" y="310">HTTP / JSON</text>
  <text class="flow-label" x="762" y="310">JSON response</text>

  <path class="flow" marker-end="url(#ah)" d="M 470 530 L 360 598"/>
  <text class="flow-label" x="270" y="560">SQL (parameterised)</text>

  <path class="flow" marker-end="url(#ah)" d="M 700 530 L 700 598"/>
  <text class="flow-label" x="712" y="575">POST /embed</text>

  <path class="flow" marker-end="url(#ah)" d="M 930 530 L 1040 598"/>
  <text class="flow-label" x="1000" y="560">REST: upsert / query / delete</text>

  <!-- Create-report sequence -->
  <g transform="translate(1030,110)">
    <rect x="0" y="0" width="330" height="170" fill="#f9fafb" stroke="#d1d5db" rx="10"/>
    <text x="16" y="26" style="font-weight:700">“Create report” flow</text>
    <circle class="step" cx="26" cy="50" r="10"/><text class="step-text" x="26" y="54" text-anchor="middle">1</text><text x="44" y="55" class="sub">INSERT into ITEM_REPORT (MySQL)</text>
    <circle class="step" cx="26" cy="78" r="10"/><text class="step-text" x="26" y="82" text-anchor="middle">2</text><text x="44" y="83" class="sub">Embed name + description (FastAPI)</text>
    <circle class="step" cx="26" cy="106" r="10"/><text class="step-text" x="26" y="110" text-anchor="middle">3</text><text x="44" y="111" class="sub">Upsert vector + payload (Qdrant)</text>
    <circle class="step" cx="26" cy="134" r="10"/><text class="step-text" x="26" y="138" text-anchor="middle">4</text><text x="44" y="139" class="sub">Search opposite type, OPEN only</text>
    <circle class="step" cx="26" cy="160" r="0"/><text x="44" y="162" class="sub">→ fetch rows from MySQL → suggestions</text>
  </g>
</svg>
</body>
</html>
